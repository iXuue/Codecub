[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecub"
version = "0.1.0"
description = "CodeCub local desktop-first coding agent backend"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codecub = "codecub.cli:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.20.0",
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["codecub"]
